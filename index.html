<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보충작업 계획서</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --accent: #185fa5;
    --bg: #f5f5f3;
    --card: #ffffff;
    --border: #ddd;
    --text: #222;
    --muted: #777;
    --danger: #a32d2d;
    --success: #3b6d11;
    --warning: #854f0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 40px; }
  header.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  header.topbar .title { font-size:16px; font-weight:600; }
  header.topbar .user { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  header.topbar button.link { background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer; }
  main { padding: 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  h2 { font-size:16px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:inherit; background:#fff; }
  textarea { resize: vertical; min-height:56px; }
  button { cursor:pointer; padding:10px 14px; border-radius:6px; border:1px solid var(--border); background:#fff; font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.block { width:100%; margin-top:10px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .muted { color:var(--muted); font-size:12px; }
  .center { text-align:center; }
  .badge { display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; }
  .badge.draft { background:#eee; color:#555; }
  .badge.pending { background:#faeeda; color:var(--warning); }
  .badge.approved { background:#eaf3de; color:var(--success); }
  .badge.rejected { background:#fcebeb; color:var(--danger); }
  .plan-item { border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .plan-item .top { display:flex; justify-content:space-between; align-items:center; }
  .plan-item .sub { font-size:12px; color:var(--muted); margin-top:4px; }
  .signature-canvas { width:100%; height:150px; border:1px dashed #999; border-radius:6px; background:#fff; touch-action:none; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; font-size:13px; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .approval-step { display:flex; justify-content:space-between; font-size:13px; border-bottom:1px solid var(--border); padding:6px 0; }
  .approval-step:last-child { border-bottom:none; }
  .error-text { color:var(--danger); font-size:12px; margin-top:4px; }
  .hidden { display:none !important; }
  #pdf-template { position:absolute; left:-9999px; top:0; width:750px; background:#fff; }
</style>
</head>
<body>
<div id="app"></div>

<!-- PDF/이미지 렌더링용 숨김 템플릿 -->
<div id="pdf-template"></div>

<script>
/* =========================================================
   설정 - 배포 전 아래 두 값을 반드시 채워주세요
   ========================================================= */
const CONFIG = {
  WORKER_URL: "https://https://overtime-api.ruleein.workers.dev", // Cloudflare Worker 주소
  GOOGLE_CLIENT_ID: "121329388169-bfa07ghdgl91l529p733bm7fh6kmbjir.apps.googleusercontent.com",
};

/* =========================================================
   전역 상태
   ========================================================= */
const state = {
  idToken: null,
  authStatus: null, // not_registered | pending | rejected | approved
  user: null, // {email, name, company, org, signatureUrl}
  companies: [],
  route: "login",
  currentPlan: null,
};

/* =========================================================
   API 헬퍼
   ========================================================= */
async function api(path, { method = "GET", body, auth = true } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth && state.idToken) headers["Authorization"] = "Bearer " + state.idToken;
  const res = await fetch(CONFIG.WORKER_URL + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "요청 처리 중 오류가 발생했습니다.");
  return data;
}

/* =========================================================
   라우팅 / 렌더
   ========================================================= */
function go(route, payload) {
  state.route = route;
  state.routePayload = payload;
  render();
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderHeader());
  const main = document.createElement("main");
  main.appendChild(renderRoute());
  app.appendChild(main);
}

function renderHeader() {
  const header = document.createElement("header");
  header.className = "topbar";
  if (!state.user) {
    header.innerHTML = `<div class="title">보충작업 계획서</div>`;
    return header;
  }
  header.innerHTML = `
    <div class="title" style="cursor:pointer" onclick="go('home')">보충작업 계획서</div>
    <div class="user">
      <span>${state.user.name} (${state.user.company})</span>
      <button class="link" onclick="go('mypage')">개인페이지</button>
      <button class="link" onclick="logout()">로그아웃</button>
    </div>`;
  return header;
}

function renderRoute() {
  if (!state.user) {
    if (state.authStatus === "not_registered") return renderRegister();
    if (state.authStatus === "pending") return renderPendingNotice();
    if (state.authStatus === "rejected") return renderRejectedNotice();
    return renderLogin();
  }
  switch (state.route) {
    case "home": return renderHome();
    case "form": return renderForm(state.routePayload);
    case "detail": return renderDetail(state.routePayload);
    case "mypage": return renderMyPage();
    case "admin": return renderAdmin();
    default: return renderHome();
  }
}

/* =========================================================
   1. 로그인 화면
   ========================================================= */
function renderLogin() {
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="card center">
      <div style="width:56px;height:56px;border-radius:50%;background:#e6f1fb;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px;">🦺</div>
      <h2>보충작업 계획서</h2>
      <p class="muted" style="margin-bottom:18px;">현장 작업계획서 작성 및 결재</p>
      <div id="gsi-button-container"></div>
      <p class="muted" style="margin-top:16px;">Google 계정으로 로그인 후 이용할 수 있습니다.</p>
    </div>`;
  setTimeout(initGoogleButton, 0);
  return div;
}

function initGoogleButton() {
  if (!window.google || !window.google.accounts) {
    setTimeout(initGoogleButton, 300);
    return;
  }
  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
  });
  const el = document.getElementById("gsi-button-container");
  if (el) google.accounts.id.renderButton(el, { theme: "outline", size: "large", width: 260 });
}

async function onGoogleCredential(response) {
  state.idToken = response.credential;
  try {
    const data = await api("/api/auth", { method: "POST", body: { idToken: state.idToken }, auth: false });
    state.authStatus = data.status;
    if (data.status === "approved") {
      state.user = data.user;
      go("home");
    } else {
      state.pendingRegisterInfo = { email: data.email, name: data.name };
      render();
    }
  } catch (e) {
    alert(e.message);
  }
}

function logout() {
  state.idToken = null;
  state.user = null;
  state.authStatus = null;
  go("login");
}

/* =========================================================
   2. 최초 등록 화면
   ========================================================= */
function renderRegister() {
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="card">
      <h2>최초 등록</h2>
      <p class="muted">가입 후 관리자(현대건설 담당자) 승인이 필요합니다.</p>
      <label>업체명</label>
      <select id="regCompanySelect"><option value="">불러오는 중...</option></select>
      <input id="regCompanyNew" type="text" placeholder="새 업체명 입력" style="display:none;margin-top:6px;" />
      <label>업체 관리자명</label>
      <input id="regAdminName" type="text" placeholder="예: 홍길동 대리" />
      <label>연락처</label>
      <input id="regPhone" type="tel" placeholder="숫자만 입력" maxlength="13" />
      <div id="regError" class="error-text"></div>
      <button class="primary block" onclick="submitRegister()">가입 신청</button>
    </div>`;
  setTimeout(async () => {
    try {
      const data = await api("/api/companies", { auth: false });
      const sel = document.getElementById("regCompanySelect");
      sel.innerHTML =
        `<option value="">업체명 선택</option>` +
        data.companies.map((c) => `<option>${c}</option>`).join("") +
        `<option>현대건설</option>` +
        `<option value="__new__">+ 새 업체 직접 입력</option>`;
      sel.addEventListener("change", () => {
        document.getElementById("regCompanyNew").style.display = sel.value === "__new__" ? "block" : "none";
      });
    } catch (e) {
      document.getElementById("regError").textContent = e.message;
    }
    const phone = document.getElementById("regPhone");
    phone.addEventListener("input", () => {
      const digits = phone.value.replace(/\D/g, "").slice(0, 11);
      phone.value =
        digits.length > 7 ? digits.slice(0, 3) + "-" + digits.slice(3, 7) + "-" + digits.slice(7)
        : digits.length > 3 ? digits.slice(0, 3) + "-" + digits.slice(3)
        : digits;
    });
  }, 0);
  return div;
}

async function submitRegister() {
  const sel = document.getElementById("regCompanySelect");
  const company = sel.value === "__new__" ? document.getElementById("regCompanyNew").value.trim() : sel.value;
  const adminName = document.getElementById("regAdminName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const errEl = document.getElementById("regError");
  if (!company || !adminName || !phone) {
    errEl.textContent = "모든 항목을 입력해주세요.";
    return;
  }
  try {
    await api("/api/register", { method: "POST", body: { idToken: state.idToken, company, adminName, phone }, auth: false });
    state.authStatus = "pending";
    render();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

function renderPendingNotice() {
  const div = document.createElement("div");
  div.innerHTML = `<div class="card center"><h2>승인 대기중</h2><p class="muted">관리자 승인 후 이용하실 수 있습니다.</p></div>`;
  return div;
}
function renderRejectedNotice() {
  const div = document.createElement("div");
  div.innerHTML = `<div class="card center"><h2>가입이 반려되었습니다</h2><p class="muted">담당자에게 문의해주세요.</p></div>`;
  return div;
}

/* =========================================================
   3. 홈 - 목록
   ========================================================= */
async function renderHome() {
  const div = document.createElement("div");
  div.innerHTML = `<div class="muted center">불러오는 중...</div>`;
  loadHome(div);
  return div;
}

async function loadHome(container) {
  try {
    const data = await api("/api/plans");
    const badgeLabel = { draft: "작성중", pending: "검토중", approved: "승인완료", rejected: "반려" };
    container.innerHTML = `
      <div class="card">
        <button class="primary block" onclick="go('form')">+ 새 작업계획서 작성</button>
      </div>
      ${state.user.org === "hyundai" ? `<div class="card"><button class="block" onclick="go('admin')">가입 승인 관리</button></div>` : ""}
      <div class="card">
        <h2>작업계획서 목록</h2>
        ${data.plans.length === 0 ? `<p class="muted">등록된 작업계획서가 없습니다.</p>` : ""}
        ${data.plans
          .map(
            (p) => `
          <div class="plan-item" onclick="go('detail', '${p.id}')">
            <div class="top">
              <span>${p.workDate} · ${p.workType}</span>
              <span class="badge ${p.status}">${badgeLabel[p.status] || p.status}</span>
            </div>
            <div class="sub">${p.company}</div>
            <div class="sub">협력업체 ${p.vendorManagerName || "-"} · 현대건설 ${p.hyundaiManagerName || "-"}</div>
          </div>`
          )
          .join("")}
      </div>
      <div class="card">
        <h2>기간별 일괄 다운로드</h2>
        <div class="row">
          <input type="date" id="batchFrom" />
          <input type="date" id="batchTo" />
        </div>
        <button class="block" onclick="batchDownload()">ZIP으로 다운로드</button>
      </div>`;
  } catch (e) {
    container.innerHTML = `<div class="card error-text">${e.message}</div>`;
  }
}

/* =========================================================
   4. 작성 폼
   ========================================================= */
async function renderForm(planId) {
  const div = document.createElement("div");
  div.innerHTML = `<div class="muted center">불러오는 중...</div>`;
  loadForm(div, planId);
  return div;
}

async function loadForm(container, planId) {
  let plan = {
    workDate: new Date().toISOString().slice(0, 10),
    workType: "점심",
    company: state.user.org === "vendor" ? state.user.company : "",
    workLocation: "",
    workforceEquipment: "",
    hazards: "",
    mitigations: "",
    workerList: "",
    vehicleInfo: "",
    hyundaiManagerEmail: "",
    hyundaiManagerName: "",
    vendorManagerEmail: "",
    vendorManagerName: "",
  };
  if (planId) {
    try {
      const data = await api("/api/plans/" + encodeURIComponent(planId));
      plan = data.plan;
    } catch (e) {
      container.innerHTML = `<div class="card error-text">${e.message}</div>`;
      return;
    }
  }

  const [companiesRes, hyundaiRes] = await Promise.all([
    api("/api/companies", { auth: false }),
    api("/api/managers?org=hyundai"),
  ]);
  let vendorManagers = [];
  if (plan.company) {
    try {
      const r = await api("/api/managers?org=vendor&company=" + encodeURIComponent(plan.company));
      vendorManagers = r.managers;
    } catch (e) {}
  }

  container.innerHTML = `
    <div class="card">
      <div class="top" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <h2 style="margin:0;">작업계획서 ${planId ? "수정" : "작성"}</h2>
        <button class="link" style="background:none;border:none;color:var(--accent);font-size:12px;" onclick="loadYesterday()">전날 내용 불러오기</button>
      </div>
      <label>작업구분</label>
      <select id="f_workType">
        ${["조출", "점심", "야간", "주말", "기상특보"].map((t) => `<option ${plan.workType === t ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      <label>작업일자</label>
      <input id="f_workDate" type="date" value="${plan.workDate}" />
      <label>업체명</label>
      <select id="f_company">
        <option value="">선택</option>
        ${companiesRes.companies.map((c) => `<option ${plan.company === c ? "selected" : ""}>${c}</option>`).join("")}
      </select>
      <label>작업장소/내용</label>
      <textarea id="f_workLocation">${plan.workLocation || ""}</textarea>
      <label>작업 인원/장비</label>
      <input id="f_workforceEquipment" type="text" value="${plan.workforceEquipment || ""}" placeholder="예: 8명 300LC 1대" />
      <label>위험요인</label>
      <textarea id="f_hazards">${plan.hazards || ""}</textarea>
      <label>저감대책</label>
      <textarea id="f_mitigations">${plan.mitigations || ""}</textarea>
      <label>작업자 명단</label>
      <textarea id="f_workerList">${plan.workerList || ""}</textarea>
      <label>차량번호</label>
      <input id="f_vehicleInfo" type="text" value="${plan.vehicleInfo || ""}" />
      <label>현대건설 담당자</label>
      <select id="f_hyundaiManager">
        <option value="">선택</option>
        ${hyundaiRes.managers.map((m) => `<option value="${m.email}" ${plan.hyundaiManagerEmail === m.email ? "selected" : ""}>${m.name}</option>`).join("")}
      </select>
      <label>협력업체 담당자</label>
      <select id="f_vendorManager">
        <option value="">업체 먼저 선택</option>
        ${vendorManagers.map((m) => `<option value="${m.email}" ${plan.vendorManagerEmail === m.email ? "selected" : ""}>${m.name}</option>`).join("")}
      </select>
      <div id="formError" class="error-text"></div>
      <div class="row" style="margin-top:12px;">
        <button onclick="savePlanForm('${planId || ""}', false)">저장</button>
        <button class="primary" onclick="savePlanForm('${planId || ""}', true)">승인요청</button>
      </div>
      <div class="muted" style="margin-top:6px;">저장 = 임시저장(계속 수정 가능) · 승인요청 = 결재 프로세스 시작</div>
    </div>`;

  document.getElementById("f_company").addEventListener("change", async (e) => {
    const r = await api("/api/managers?org=vendor&company=" + encodeURIComponent(e.target.value));
    document.getElementById("f_vendorManager").innerHTML =
      `<option value="">선택</option>` + r.managers.map((m) => `<option value="${m.email}">${m.name}</option>`).join("");
  });
}

function collectFormData() {
  const hyundaiSel = document.getElementById("f_hyundaiManager");
  const vendorSel = document.getElementById("f_vendorManager");
  return {
    workType: document.getElementById("f_workType").value,
    workDate: document.getElementById("f_workDate").value,
    company: document.getElementById("f_company").value,
    workLocation: document.getElementById("f_workLocation").value,
    workforceEquipment: document.getElementById("f_workforceEquipment").value,
    hazards: document.getElementById("f_hazards").value,
    mitigations: document.getElementById("f_mitigations").value,
    workerList: document.getElementById("f_workerList").value,
    vehicleInfo: document.getElementById("f_vehicleInfo").value,
    hyundaiManagerEmail: hyundaiSel.value,
    hyundaiManagerName: hyundaiSel.options[hyundaiSel.selectedIndex]?.text || "",
    vendorManagerEmail: vendorSel.value,
    vendorManagerName: vendorSel.options[vendorSel.selectedIndex]?.text || "",
  };
}

async function savePlanForm(planId, submitAfter) {
  const errEl = document.getElementById("formError");
  const body = collectFormData();
  if (!body.workDate || !body.company || !body.workType) {
    errEl.textContent = "작업일자, 업체명, 작업구분은 필수입니다.";
    return;
  }
  if (planId) body.id = planId;
  try {
    const res = await api("/api/plans", { method: "POST", body });
    if (submitAfter) {
      await api(`/api/plans/${encodeURIComponent(res.id)}/submit`, { method: "POST" });
    }
    go("detail", res.id);
  } catch (e) {
    errEl.textContent = e.message;
  }
}

async function loadYesterday() {
  try {
    const data = await api("/api/plans");
    if (data.plans.length === 0) return alert("불러올 이전 내용이 없습니다.");
    const latest = data.plans[0];
    const detail = await api("/api/plans/" + encodeURIComponent(latest.id));
    const p = detail.plan;
    document.getElementById("f_workLocation").value = p.workLocation || "";
    document.getElementById("f_workforceEquipment").value = p.workforceEquipment || "";
    document.getElementById("f_hazards").value = p.hazards || "";
    document.getElementById("f_mitigations").value = p.mitigations || "";
    document.getElementById("f_workerList").value = p.workerList || "";
    document.getElementById("f_vehicleInfo").value = p.vehicleInfo || "";
  } catch (e) {
    alert(e.message);
  }
}

/* =========================================================
   5. 상세 / 결재 / 다운로드
   ========================================================= */
async function renderDetail(planId) {
  const div = document.createElement("div");
  div.innerHTML = `<div class="muted center">불러오는 중...</div>`;
  loadDetail(div, planId);
  return div;
}

async function loadDetail(container, planId) {
  try {
    const data = await api("/api/plans/" + encodeURIComponent(planId));
    const plan = data.plan;
    state.currentPlan = plan;
    const badgeLabel = { draft: "작성중", pending: "검토중", approved: "승인완료", rejected: "반려" };
    const canApprove = state.user.org === "hyundai" && plan.status === "pending";
    const canEdit = plan.status !== "approved";

    container.innerHTML = `
      <div class="card">
        <div class="top" style="display:flex;justify-content:space-between;">
          <h2>${plan.workDate} · ${plan.workType}</h2>
          <span class="badge ${plan.status}">${badgeLabel[plan.status] || plan.status}</span>
        </div>
        <p class="muted">${plan.company}</p>
        <div class="approval-step"><span>작성 · ${plan.writerName || "-"}</span><span>${plan.status === "draft" ? "임시저장" : "완료"}</span></div>
        <div class="approval-step"><span>승인 · ${plan.hyundaiManagerName || "미지정"}</span><span>${plan.approval ? "완료 (" + plan.approval.approverName + ")" : "대기중"}</span></div>
        ${plan.rejectReason ? `<p class="error-text">반려 사유: ${plan.rejectReason}</p>` : ""}
        <div class="row" style="margin-top:12px;">
          ${canEdit ? `<button onclick="go('form', '${plan.id}')">수정</button>` : ""}
          ${canApprove ? `<button class="primary" onclick="approvePlan('${plan.id}')">승인</button>` : ""}
        </div>
        ${canApprove ? `<button class="block" style="color:var(--danger);" onclick="rejectPlan('${plan.id}')">반려</button>` : ""}
      </div>
      <div class="card">
        <h2>다운로드</h2>
        <div class="row">
          <button onclick="downloadPlan('${plan.id}', 'pdf')">PDF</button>
          <button onclick="downloadPlan('${plan.id}', 'png')">이미지</button>
        </div>
      </div>`;
  } catch (e) {
    container.innerHTML = `<div class="card error-text">${e.message}</div>`;
  }
}

async function approvePlan(id) {
  if (!confirm("이 작업계획서를 승인하시겠습니까?")) return;
  try {
    await api(`/api/plans/${encodeURIComponent(id)}/approve`, { method: "POST" });
    go("detail", id);
  } catch (e) {
    alert(e.message);
  }
}
async function rejectPlan(id) {
  const reason = prompt("반려 사유를 입력해주세요.");
  if (reason === null) return;
  try {
    await api(`/api/plans/${encodeURIComponent(id)}/reject`, { method: "POST", body: { reason } });
    go("detail", id);
  } catch (e) {
    alert(e.message);
  }
}

function renderMyPage() {
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="card">

      <p class="muted">${state.user.name} · ${state.user.company} (${state.user.org === "hyundai" ? "현대건설" : "협력업체"})</p>
    </div>
    <div class="card">
      <h2>내 서명 등록</h2>
      <div class="tabs">
        <button id="tabDraw" class="active" onclick="switchSigTab('draw')">그려서 등록</button>
        <button id="tabUpload" onclick="switchSigTab('upload')">이미지 업로드</button>
      </div>
      <div id="sigDrawArea">
        <canvas id="sigPad" class="signature-canvas" width="700" height="220"></canvas>
        <div class="row" style="margin-top:10px;">

    </div>`;
  setTimeout(setupSignaturePad, 0);
  return div;
}

function switchSigTab(tab) {
  document.getElementById("tabDraw").className = tab === "draw" ? "active" : "";
  document.getElementById("tabUpload").className = tab === "upload" ? "active" : "";
  document.getElementById("sigDrawArea").classList.toggle("hidden", tab !== "draw");
  document.getElementById("sigUploadArea").classList.toggle("hidden", tab !== "upload");
}

let sigCtx, sigDrawing = false;
function setupSignaturePad() {
  const canvas = document.getElementById("sigPad");
  if (!canvas) return;
  sigCtx = canvas.getContext("2d");
  sigCtx.lineWidth = 3;
  sigCtx.lineCap = "round";
  sigCtx.strokeStyle = "#222";
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx * (canvas.width / r.width), y: cy * (canvas.height / r.height) };
  }
  function start(e) { sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e) { if (!sigDrawing) return; const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); }
  function end() { sigDrawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start);
  canvas.addEventListener("touchmove", move);
  canvas.addEventListener("touchend", end);
}
function clearSignaturePad() {
  const canvas = document.getElementById("sigPad");
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
}
async function saveSignatureFromCanvas() {
  const canvas = document.getElementById("sigPad");
  const dataUrl = canvas.toDataURL("image/png");
  await uploadSignature(dataUrl);
}
async function saveSignatureFromFile() {
  const fileInput = document.getElementById("sigFile");
  if (!fileInput.files[0]) return alert("파일을 선택해주세요.");
  const reader = new FileReader();
  reader.onload = async () => await uploadSignature(reader.result);
  reader.readAsDataURL(fileInput.files[0]);
}
async function uploadSignature(dataUrl) {
  try {
    await api("/api/signature", { method: "POST", body: { imageBase64: dataUrl } });
    document.getElementById("sigMsg").textContent = "서명이 저장되었습니다.";
    state.user.signatureUrl = "saved";
  } catch (e) {
    document.getElementById("sigMsg").textContent = e.message;
  }
}

async function renderPlanToCanvas(plan) {
  const container = document.getElementById("pdf-template");
  container.innerHTML = planToTemplateHtml(plan);
  if (plan.approval && plan.approval.signatureUrl) {
    try {
      const imgUrl = await getSignatureImageUrl(plan.approval.signatureUrl);
      const cell = document.getElementById("pdf-sig-cell");
      if (cell && imgUrl) cell.innerHTML = `<img src="${imgUrl}" style="height:30px;" crossorigin="anonymous" />`;
    } catch (e) {}
  }
  await new Promise((r) => setTimeout(r, 50));
  const canvas = await html2canvas(container, { scale: 2, useCORS: true });
  container.innerHTML = "";
  return canvas;
}

async function getSignatureImageUrl(path) {
  // GitHub raw 콘텐츠 URL (저장소가 private이면 이 방식은 표시가 제한될 수 있습니다.
  // 필요시 Worker에 서명 이미지를 프록시하는 API를 추가하세요.
  return `https://raw.githubusercontent.com/${WORKER_REPO_HINT}/${path}`;
}
const WORKER_REPO_HINT = "Gwisin/OverTime/main"; // README 참고하여 실제 값으로 교체

async function downloadPlan(id, type) {
  try {
    const data = await api("/api/plans/" + encodeURIComponent(id));
    const canvas = await renderPlanToCanvas(data.plan);
    if (type === "png") {
      const link = document.createElement("a");
      link.download = `${id}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    } else {
      const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "px", format: [canvas.width / 2, canvas.height / 2] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width / 2, canvas.height / 2);
      pdf.save(`${id}.pdf`);
    }
  } catch (e) {
    alert(e.message);
  }
}

async function batchDownload() {
  const from = document.getElementById("batchFrom").value;
  const to = document.getElementById("batchTo").value;
  if (!from || !to) return alert("기간을 선택해주세요.");
  try {
    const data = await api(`/api/plans?from=${from}&to=${to}`);
    if (data.plans.length === 0) return alert("해당 기간에 작업계획서가 없습니다.");
    const zip = new JSZip();
    for (const p of data.plans) {
      const detail = await api("/api/plans/" + encodeURIComponent(p.id));
      const canvas = await renderPlanToCanvas(detail.plan);
      const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "px", format: [canvas.width / 2, canvas.height / 2] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width / 2, canvas.height / 2);
      zip.file(`${p.id}.pdf`, pdf.output("blob"));
    }
    const blob = await zip.generateAsync({ type: "blob" });
    const link = document.createElement("a");
    link.download = `작업계획서_${from}_${to}.zip`;
    link.href = URL.createObjectURL(blob);
    link.click();
  } catch (e) {
    alert(e.message);
  }
}
