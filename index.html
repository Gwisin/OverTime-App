   - 조회 범위 문구 정리("전체" / "당사"), 안내 문구 삭제

   - 작업계획서 목록 10개씩 보기 + 더보기
-->

<style>
  :root {
    --accent: #1b64da;
    --bg: #f5f6f8;
    --card: #ffffff;
    --line: #eceef2;
    --border: #dfe3e9;
    --text: #191f28;
    --sub: #4e5968;
    --muted: #6b7684;
    --danger: #d92d20;
    --success: #0f7a3d;

    --radius: 12px;

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.5; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--text); }
  button, input, select, textarea { font-family: inherit; }
  #app { min-height: 100vh; padding-bottom: 48px; }

  /* 상단 바 */
  header.topbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px max(16px, calc((100% - 760px) / 2 + 16px)); background: var(--card); border-bottom: 1px solid var(--line); }
  header.topbar .title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; flex-shrink: 0; }

  header.topbar .userinfo span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.topbar .userinfo span:first-child { color: var(--text); font-weight: 600; }

  /* 버튼 */

  /* 상태 배지 */

  /* 작업계획서 목록 카드 */

  .plan-item .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

  .plan-item .time { margin-top: 2px; font-size: 15px; font-weight: 500; color: var(--sub); }
  .plan-item .time .dot { margin: 0 6px; color: #b0b8c1; }

  .plan-item .meta { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .plan-item .meta-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--sub); }
  .plan-item .meta-row.company { font-size: 14px; font-weight: 500; color: var(--text); }
  .plan-item .meta-row.wrap { flex-wrap: wrap; gap: 4px 14px; }
  .plan-item .meta-item { display: inline-flex; align-items: flex-start; gap: 6px; }
  .plan-item .meta-row svg { width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; color: #98a2b3; }
  .plan-item .sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
  /* 카드 안에 들어간 목록(가입 승인 등)은 박스 없이 구분선으로 */
  .card .plan-item { padding: 14px 0; background: transparent; border-bottom: 1px solid var(--line); border-radius: 0; box-shadow: none; cursor: default; }
  .card .plan-item:last-child { padding-bottom: 0; border-bottom: none; }

  .approval-step { display: flex; align-items: baseline; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }

  .signature-canvas { width: 100%; height: 150px; border: 1.5px dashed #c5ccd6; border-radius: 10px; background: #fafbfc; touch-action: none; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; padding: 4px; background: #eef0f3; border-radius: 10px; }
  .tabs button { flex: 1; height: 36px; border: none; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; }
  .tabs button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(16, 24, 40, 0.1); }

  .date-wrap { position: relative; }
  .date-label { display: flex; align-items: center; height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 16px; }

  .fake-field { display: flex; align-items: center; height: 44px; padding: 0 12px; border: 1px dashed var(--border); border-radius: 8px; background: #f7f8fa; color: var(--muted); font-size: 14px; }

  .sig-preview { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; text-align: center; }
  .sig-preview img { max-width: 100%; max-height: 120px; }

  /* 사용자 관리 */
  .user-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .user-row:first-child { padding-top: 0; }
  .user-row:last-child { padding-bottom: 0; border-bottom: none; }
  .user-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .user-name { font-size: 15px; font-weight: 600; }
  .user-row .sub { margin-top: 2px; font-size: 13px; color: var(--muted); word-break: break-all; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: #eaf2ff; color: var(--accent); font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .user-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .user-actions button { height: 36px; padding: 0 12px; font-size: 13px; }
  button.danger { color: var(--danger); }
  .user-edit { margin-top: 10px; padding: 12px; border-radius: 10px; background: #f7f8fa; }
  .user-edit label:first-child { margin-top: 0; }

  /* 로그인/안내 카드는 PC에서 폭 제한 */
  .card.center { max-width: 420px; margin: 24px auto; }

  /* 로그인 화면 (로그인 route에서만 body.is-login 이 붙음) */
  body.is-login { background-color: #f4f7fb; background-image: radial-gradient(900px 520px at 12% 8%, rgba(27, 100, 218, 0.09), transparent 62%), radial-gradient(800px 480px at 92% 92%, rgba(27, 100, 218, 0.07), transparent 62%), linear-gradient(180deg, #f8fafd 0%, #eef3fa 100%); background-attachment: fixed; }
  body.is-login #app { min-height: 0; padding-bottom: 0; }
  body.is-login main { max-width: none; padding: 0; }
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 24px 0; }
  .login-card { width: calc(100% - 32px); max-width: 420px; padding: 40px 40px 36px; background: var(--card); border-radius: 20px; box-shadow: 0 12px 40px rgba(16, 24, 40, 0.08), 0 1px 3px rgba(16, 24, 40, 0.05); }
  .login-icon { display: block; width: 92px; height: 92px; margin: 0 auto 20px; object-fit: contain; }
  .login-title { margin: 0 0 8px; font-size: 28px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; color: var(--text); text-align: center; }
  .login-subtitle { margin: 0 0 28px; font-size: 15px; line-height: 1.5; color: var(--muted); text-align: center; }
  #gsi-button-container { display: flex; justify-content: center; width: 100%; min-height: 44px; }
  .login-help { margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: var(--muted); text-align: center; }
  .login-dev { margin: 26px 0 0; text-align: center; }
  .login-dev a { color: var(--accent); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 480px) {
    .login-card { padding: 30px 20px 32px; }

  @media (max-width: 340px) { .login-title { font-size: 26px; } }

  @media (max-width: 380px) { header.topbar .title { font-size: 15px; } }
  @media (min-width: 768px) {
    main { padding: 24px 16px 48px; }
    .card { padding: 22px 20px; }
    input, select, textarea, .date-label { font-size: 15px; }

  #pdf-template { position: absolute; left: -9999px; top: 0; width: 750px; background: #fff; }

<div id="app"></div>

<!-- PDF/이미지 렌더링용 숨김 템플릿 -->

<script>
/* =========================================================
   설정 - 배포 전 아래 두 값을 반드시 채워주세요
   ========================================================= */
const CONFIG = {
  WORKER_URL: "https://overtime-api.ruleein.workers.dev", // Cloudflare Worker 주소
  GOOGLE_CLIENT_ID: "121329388169-bfa07ghdgl91l529p733bm7fh6kmbjir.apps.googleusercontent.com",
};

/* =========================================================
   전역 상태
   ========================================================= */
const state = {
  idToken: null,
  authStatus: null, // not_registered | pending | rejected | approved
  user: null, // {email, name, company, org, signatureUrl}
  companies: [],
  homePlans: [], // 홈 목록(정렬 완료) — '더보기'에서 재사용
  planVisibleCount: 10, // 홈 목록에 보여줄 개수 (더보기 누를 때마다 +10, 조회 범위를 바꾸면 10으로 초기화)
  planViewFilter: "", // "" = 역할별 기본값(협력업체는 내 업체, 현대건설/ADMIN은 전체), "__all__" = 전체, 그 외 = 특정 업체명
  route: "login",
  currentPlan: null,
};

/* =========================================================
   API 헬퍼
   ========================================================= */
async function api(path, { method = "GET", body, auth = true } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth && state.idToken) headers["Authorization"] = "Bearer " + state.idToken;
  const res = await fetch(CONFIG.WORKER_URL + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "요청 처리 중 오류가 발생했습니다.");
  return data;
}

/* =========================================================
   라우팅 / 렌더
   ========================================================= */
// 화면 이동. 브라우저 히스토리에 화면 단위로 기록해서 '뒤로가기'가 직전 화면으로 가도록 함.
//  - 기본: 새 기록을 쌓음(push)
//  - 같은 화면을 다시 그리는 경우(승인/반려 후 새로고침 등), 로그인 직후 첫 이동: 기록을 덮어씀(replace)
//  - opts.replace: 저장/삭제 후 이동. 이동할 화면이 바로 직전 화면이면 뒤로 돌아가고, 아니면 현재 기록을 덮어씀
function navSame(a, b) {
  return !!a && !!b && a.route === b.route && JSON.stringify(a.payload === undefined ? null : a.payload) === JSON.stringify(b.payload === undefined ? null : b.payload);
}
function go(route, payload, opts) {
  const entry = { route, payload };
  const cur = history.state && history.state.route ? history.state : null;
  const fromLogin = state.route === "login";
  state.route = route;
  state.routePayload = payload;
  if (fromLogin || route === "login" || !cur) {
    history.replaceState({ route, payload }, "");
  } else if (opts && opts.replace && cur.prev && navSame(cur.prev, entry)) {
    history.back(); // popstate 핸들러가 직전 화면을 다시 그림
    return;
  } else if ((opts && opts.replace) || navSame(cur, entry)) {
    history.replaceState({ route, payload, prev: cur.prev }, "");
  } else {
    history.pushState({ route, payload, prev: { route: cur.route, payload: cur.payload } }, "");
  }
  render();
}
window.addEventListener("popstate", (e) => {
  const s = e.state;
  if (state.user) {
    if (s && s.route && s.route !== "login") {
      state.route = s.route;
      state.routePayload = s.payload;
    } else {
      state.route = "home";
      state.routePayload = undefined;
    }
  }
  render();
});

function render() {
  const app = document.getElementById("app");
  // 일반 로그인 화면(가입신청/승인대기/반려/이용정지 화면이 아닐 때)에서는 상단 바를 그리지 않음
  const isLoginScreen = !state.user && !["not_registered", "pending", "rejected", "suspended"].includes(state.authStatus);
  document.body.classList.toggle("is-login", isLoginScreen);
  app.innerHTML = "";
  if (!isLoginScreen) app.appendChild(renderHeader());
  const main = document.createElement("main");
  main.appendChild(renderRoute());
  app.appendChild(main);
}

function renderHeader() {
  const header = document.createElement("header");
  header.className = "topbar";
  if (!state.user) {
    header.innerHTML = `<div class="title">보충작업 계획서</div>`;
    return header;
  }
  header.innerHTML = `
    <div class="title" style="cursor:pointer" onclick="go('home')">보충작업 계획서</div>
    <div class="user">
      <div class="userinfo"><span>${state.user.name}</span><span>${state.user.company}</span></div>
      <button class="link" onclick="go('mypage')">마이페이지</button>
      <button class="link" onclick="logout()">로그아웃</button>
    </div>`;
  return header;
}

function renderRoute() {
  if (!state.user) {
    if (state.authStatus === "not_registered") return renderRegister();
    if (state.authStatus === "pending") return renderPendingNotice();
    if (state.authStatus === "rejected") return renderRejectedNotice();
    if (state.authStatus === "suspended") return renderSuspendedNotice();
    return renderLogin();
  }
  switch (state.route) {
    case "home": return renderHome();
    case "form": return renderForm(state.routePayload);
    case "detail": return renderDetail(state.routePayload);
    case "mypage": return renderMyPage();
    case "admin": return renderAdmin();
    case "users": return renderUsers();
    default: return renderHome();
  }
}

/* =========================================================
   1. 로그인 화면
   ========================================================= */
function renderLogin() {
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img class="login-icon" src="assets/app-icon.png" width="92" height="92" alt="보충작업 계획서 앱 아이콘" />
        <h1 class="login-title">보충작업 계획서</h1>
        <p class="login-subtitle">현장 보충작업 계획서 작성 및 결재</p>
        <div id="gsi-button-container"></div>
        <p class="login-help">Google 계정으로 로그인 후 이용할 수 있습니다.</p>
        <div class="login-dev"><a href="#" onclick="toggleTestLogin();return false;">테스트 로그인 (개발용)</a></div>
        <div id="testLoginArea" class="hidden">
          <label>테스트 시크릿</label>
          <input id="testSecret" type="password" placeholder="Worker에 등록한 TEST_LOGIN_SECRET" />
          <label>테스트 이메일 (가상 아이디처럼 사용)</label>
          <input id="testEmail" type="text" placeholder="예: tester1@test.local" />
          <label>이름</label>
          <input id="testName" type="text" placeholder="예: 홍길동" />
          <button class="primary block" onclick="testLogin()">테스트 로그인</button>
        </div>
      </div>
    </div>`;
  setTimeout(initGoogleButton, 0);
  return div;
}

function initGoogleButton() {
  if (!window.google || !window.google.accounts) {
    setTimeout(initGoogleButton, 300);
    return;
  }
  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
  });
  renderGoogleButton();
}

// 로그인 카드의 실제 가용 폭에 맞춰 공식 Google 버튼 폭을 정함 (GIS 허용 200~400px, 여기서는 최대 360px)
let lastGsiWidth = 0;
function renderGoogleButton() {
  const el = document.getElementById("gsi-button-container");
  if (!el || !window.google || !window.google.accounts) return;
  const available = Math.floor(el.clientWidth) || 260;
  const width = Math.max(200, Math.min(available, 360));
  lastGsiWidth = width;
  el.innerHTML = "";
  google.accounts.id.renderButton(el, { theme: "outline", size: "large", width });
}
// 화면 회전/창 크기 변경 시 폭이 실제로 달라졌을 때만 버튼을 다시 그림
let gsiResizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(gsiResizeTimer);
  gsiResizeTimer = setTimeout(() => {
    const el = document.getElementById("gsi-button-container");
    if (!el) return;
    const next = Math.max(200, Math.min(Math.floor(el.clientWidth) || 260, 360));
    if (next !== lastGsiWidth) renderGoogleButton();
  }, 200);
});

// 시간 드롭다운 값 일괄 설정 (30분 단위로 내림 보정)
function setTimeSelects(start, end) {
  const norm = (t) => {
    if (!t) return ["", ""];
    const [h, m] = t.split(":");
    return [h, Number(m) >= 30 ? "30" : "00"];
  };
  const [sh, sm] = norm(start);
  const [eh, em] = norm(end);
  document.getElementById("f_startHour").value = sh;
  document.getElementById("f_startMin").value = sm;
  document.getElementById("f_endHour").value = eh;
  document.getElementById("f_endMin").value = em;
}
// 같은 업체의 가장 최근 조출 작업 시작시간 (목록은 최신순 정렬)
function latestJochulStart(plans, company) {
  const found = plans.find((p) => p.workType === "조출" && p.workTimeStart && (!company || p.company === company));
  return found ? found.workTimeStart : null;
}
// 작성화면용 날짜 표시: 2026.09.29(화)
function formatDateLabel(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return `${dateStr.replace(/-/g, ".")}(${DAY_NAMES[d.getDay()]})`;
}

// 시/분 드롭다운 (24시간제, 30분 단위) 헬퍼
function hourOptions(selected) {
  let html = `<option value="">시</option>`;
  for (let h = 0; h < 24; h++) {
    const v = String(h).padStart(2, "0");
    html += `<option value="${v}" ${selected === v ? "selected" : ""}>${v}시</option>`;
  }
  return html;
}
function minuteOptions(selected) {
  let html = `<option value="">분</option>`;
  ["00", "30"].forEach((m) => {
    html += `<option value="${m}" ${selected === m ? "selected" : ""}>${m}분</option>`;
  });
  return html;
}
function splitTime(t) {
  if (!t) return ["", ""];
  const parts = t.split(":");
  return [parts[0] || "", parts[1] || ""];
}
function combineTime(hourId, minId) {
  const h = document.getElementById(hourId).value;
  const m = document.getElementById(minId).value;
  return h && m ? `${h}:${m}` : "";
}

// "2026.09.29(화) 05:00~07:00" 형태로 표시
const DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];
function formatDateTimeDisplay(dateStr, startTime, endTime) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  const dateLabel = `${dateStr.replace(/-/g, ".")}(${DAY_NAMES[d.getDay()]})`;
  const timeLabel = startTime && endTime ? ` ${startTime}~${endTime}` : "";
  return dateLabel + timeLabel;
}

function collectFormData() {
  const vendorSel = document.getElementById("f_vendorManager");
  return {
    workType: document.getElementById("f_workType").value,

function switchSigTab(tab) {
  document.getElementById("tabDraw").className = tab === "draw" ? "active" : "";
  document.getElementById("tabUpload").className = tab === "upload" ? "active" : "";
  document.getElementById("sigDrawArea").classList.toggle("hidden", tab !== "draw");
  document.getElementById("sigUploadArea").classList.toggle("hidden", tab !== "upload");
}

let sigCtx, sigDrawing = false;
function setupSignaturePad() {
  const canvas = document.getElementById("sigPad");
  if (!canvas) return;
  sigCtx = canvas.getContext("2d");
  sigCtx.lineWidth = 3;
  sigCtx.lineCap = "round";
  sigCtx.strokeStyle = "#222";
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx * (canvas.width / r.width), y: cy * (canvas.height / r.height) };
  }
  function start(e) { sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e) { if (!sigDrawing) return; const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); }
  function end() { sigDrawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start);
  canvas.addEventListener("touchmove", move);
  canvas.addEventListener("touchend", end);
}
function clearSignaturePad() {
  const canvas = document.getElementById("sigPad");
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
}
async function saveSignatureFromCanvas() {
  const canvas = document.getElementById("sigPad");
  const dataUrl = canvas.toDataURL("image/png");
  await uploadSignature(dataUrl);
}
async function saveSignatureFromFile() {
  const fileInput = document.getElementById("sigFile");
  if (!fileInput.files[0]) return alert("파일을 선택해주세요.");
  const reader = new FileReader();
  reader.onload = async () => await uploadSignature(reader.result);
  reader.readAsDataURL(fileInput.files[0]);
}
async function uploadSignature(dataUrl) {
  try {
    await api("/api/signature", { method: "POST", body: { imageBase64: dataUrl } });
    document.getElementById("sigMsg").textContent = "서명이 저장되었습니다.";
    state.user.signatureUrl = "saved";
    await loadMySignature();
  } catch (e) {
    document.getElementById("sigMsg").textContent = e.message;
  }
}

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// 예전에 저장된 "선택" 같은 안내 문구는 빈 값으로 취급
function cleanName(n) {
  return !n || n === "선택" || n === "업체 먼저 선택" ? "" : n;
}
// 2026.09.29, 16:30 (한국시간)
function formatDoneTime(iso) {
  if (!iso) return "";
  const parts = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(iso));
  const g = (t) => (parts.find((x) => x.type === t) || {}).value || "";
  return `${g("year")}.${g("month")}.${g("day")}, ${g("hour")}:${g("minute")}`;
}
function formatPhoneValue(v) {
  const d = v.replace(/\D/g, "").slice(0, 11);
  return d.length > 7 ? d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7) : d.length > 3 ? d.slice(0, 3) + "-" + d.slice(3) : d;
}

  const { users, q, company } = adminUsersState;

async function saveUserEdit(i) {
  const u = adminUsersState.users[i];
  const name = document.getElementById(`ue-name-${i}`).value.trim();
  const company = document.getElementById(`ue-company-${i}`).value.trim();
  const phone = document.getElementById(`ue-phone-${i}`).value.trim();

  msg.className = "error-text";
  if (!name || !company) {
    msg.textContent = "이름과 회사명을 입력해주세요.";
    return;
  }
  const companyChanged = company !== u.company;
  if (companyChanged) {
    const sameCount = adminUsersState.users.filter((x) => x.company === u.company).length;
    if (!confirm(`회사명을 "${u.company}" → "${company}"(으)로 변경합니다.\n같은 업체 소속 ${sameCount}명 전원과 기존 작업계획서의 업체명이 함께 바뀝니다. 진행할까요?`)) return;
  }
  try {
    if (name !== u.name || phone !== (u.phone || "")) {
      await api("/api/admin/users/update", { method: "POST", body: { email: u.email, name, phone } });
    }
    if (companyChanged) {
      let done = 0;
      let remaining = 1;
      while (remaining > 0) {
        const r = await api("/api/admin/rename-company", { method: "POST", body: { from: u.company, to: company } });
        done += r.plansUpdated;
        remaining = r.remaining;
        if (remaining > 0) {
          msg.className = "muted";
          msg.textContent = `작업계획서 업체명 변경 중... (${done}건 완료, ${remaining}건 남음)`;
        }
        if (r.plansUpdated === 0) break;
      }
      if (state.user.company === u.company) {
        state.user.company = company;
        state.user.org = company === "현대건설" ? "hyundai" : "vendor";
      }
    }
    if (u.email === state.user.email) state.user.name = name;
    await reloadUsersList();
    const header = document.querySelector("header.topbar");
    if (header) header.replaceWith(renderHeader());
  } catch (e) {
    msg.className = "error-text";
    msg.textContent = e.message;
  }
}

async function showUserSignature(i) {
  const u = adminUsersState.users[i];
  const box = document.getElementById("uextra-" + i);
  if (!u.hasSignature) {
    box.innerHTML = `<div class="muted" style="margin-top:10px;">등록된 서명이 없습니다.</div>`;
    return;
  }
  box.innerHTML = `<div class="muted" style="margin-top:10px;">불러오는 중...</div>`;
  try {
    const r = await api("/api/admin/signature?email=" + encodeURIComponent(u.email));
    box.innerHTML = r.dataUrl
      ? `<div class="sig-preview" style="margin-top:10px;"><img src="${r.dataUrl}" alt="서명" /></div>`
      : `<div class="muted" style="margin-top:10px;">서명 파일을 찾을 수 없습니다.</div>`;
  } catch (e) {
    box.innerHTML = `<div class="error-text">${esc(e.message)}</div>`;
  }
}

async function toggleUserStatus(i) {
  const u = adminUsersState.users[i];
  const next = u.status === "suspended" ? "approved" : "suspended";
  const label = next === "suspended" ? "이용 정지" : "정지 해제";
  if (!confirm(`${u.name}(${u.company}) 님을 ${label} 하시겠습니까?`)) return;
  try {
    await api("/api/admin/users/status", { method: "POST", body: { email: u.email, status: next } });
    await reloadUsersList();
  } catch (e) {
    alert(e.message);
  }
}

async function deleteUser(i) {
  const u = adminUsersState.users[i];
  if (!confirm(`${u.name}(${u.company}) 계정을 삭제하시겠습니까?\n등록된 서명도 함께 삭제되며 복구할 수 없습니다.\n(이미 작성된 작업계획서는 그대로 남습니다.)`)) return;
  try {
    await api("/api/admin/users/delete", { method: "POST", body: { email: u.email } });
    await reloadUsersList();
  } catch (e) {
    alert(e.message);
  }
}

async function renderPlanToCanvas(plan) {
  const container = document.getElementById("pdf-template");
  container.innerHTML = planToTemplateHtml(plan);
  if (plan.approval && plan.approval.signatureUrl) {
    try {
      const imgUrl = await getSignatureImageUrl(plan.approval.signatureUrl);
      const cell = document.getElementById("pdf-sig-cell");
      if (cell && imgUrl) cell.innerHTML = `<img src="${imgUrl}" style="height:30px;" crossorigin="anonymous" />`;
    } catch (e) {}
  }
  await new Promise((r) => setTimeout(r, 50));
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  const canvas = await html2canvas(container, { scale: 2, useCORS: true });
  container.innerHTML = "";
  return canvas;
}

async function getSignatureImageUrl(path) {
  // GitHub raw 콘텐츠 URL (저장소가 private이면 이 방식은 표시가 제한될 수 있습니다.
  // 필요시 Worker에 서명 이미지를 프록시하는 API를 추가하세요.
  return `https://raw.githubusercontent.com/${WORKER_REPO_HINT}/${path}`;
}
const WORKER_REPO_HINT = "Gwisin/OverTime/main"; // README 참고하여 실제 값으로 교체

async function downloadPlan(id, type) {
  try {
    const data = await api("/api/plans/" + encodeURIComponent(id));
    const canvas = await renderPlanToCanvas(data.plan);
    if (type === "png") {
      const link = document.createElement("a");
      link.download = `${id}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    } else {
      const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "px", format: [canvas.width / 2, canvas.height / 2] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width / 2, canvas.height / 2);
      pdf.save(`${id}.pdf`);
    }
  } catch (e) {
    alert(e.message);
  }
}

async function batchDownload() {
  const from = document.getElementById("batchFrom").value;
  const to = document.getElementById("batchTo").value;
  if (!from || !to) return alert("기간을 선택해주세요.");
  try {
    const data = await api(`/api/plans?from=${from}&to=${to}`);
    if (data.plans.length === 0) return alert("해당 기간에 작업계획서가 없습니다.");
    const zip = new JSZip();
    for (const p of data.plans) {
      const detail = await api("/api/plans/" + encodeURIComponent(p.id));
      const canvas = await renderPlanToCanvas(detail.plan);
      const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "px", format: [canvas.width / 2, canvas.height / 2] });
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width / 2, canvas.height / 2);
      zip.file(`${p.id}.pdf`, pdf.output("blob"));
    }
    const blob = await zip.generateAsync({ type: "blob" });
    const link = document.createElement("a");
    link.download = `작업계획서_${from}_${to}.zip`;
    link.href = URL.createObjectURL(blob);
    link.click();
  } catch (e) {
    alert(e.message);
  }
}

/* =========================================================
   시작 (저장된 로그인 정보로 자동 로그인 시도)
   ========================================================= */
function renderBootLoading() {
  document.getElementById("app").innerHTML = `<main><div class="card center muted" style="margin-top:40px;">로그인 확인 중...</div></main>`;
}

function attemptSilentGoogleLogin() {
  if (!window.google || !window.google.accounts) {
    setTimeout(attemptSilentGoogleLogin, 300);
    return;
  }
  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
    auto_select: true,
  });
  google.accounts.id.prompt((notification) => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      render(); // 조용한 재로그인 실패 → 일반 로그인 화면으로
    }
  });
}

function bootAuth() {
  const saved = localStorage.getItem("idToken");
  if (!saved) {
    render();
    return;
  }
  renderBootLoading();
  state.idToken = saved;
  api("/api/auth", { method: "POST", body: { idToken: saved }, auth: false })
    .then((data) => {
      state.authStatus = data.status;
      if (data.status === "approved") {
        state.user = data.user;
        go("home");
      } else {
        render();
      }
    })
    .catch(() => {
      localStorage.removeItem("idToken");
      state.idToken = null;
      if (saved.startsWith("TEST::")) {
        render();
      } else {
        attemptSilentGoogleLogin();
      }
    });
}

bootAuth();
